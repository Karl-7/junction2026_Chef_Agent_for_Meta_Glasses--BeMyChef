# fly.toml app configuration file generated for junction2026-meta-glasses-cooking-assistant--bemychef on 2026-11-15T17:45:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'junction2026-meta-glasses-cooking-assistant--bemychef'
primary_region = 'arn'

[build]
[[mounts]]
  source = 'saved_recipes'
  destination = '/app/saved_recipes'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Recipes the bot saves survive redeploys and restarts.
[[mounts]]
  source = 'saved_recipes'
  destination = '/app/saved_recipes'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
