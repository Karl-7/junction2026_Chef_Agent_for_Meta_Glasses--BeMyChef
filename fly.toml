# Fly.io: one machine runs the glasses server and the Telegram bot (see Dockerfile).
# Keys are Fly secrets, not in this file: GEMINI_API_KEY, TELEGRAM_BOT_TOKEN.

app = 'junction2026-meta-glasses-cooking-assistant--bemychef'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 8765            # the port scripts/start.sh serves on
  force_https = true
  # Always on: the Telegram bot polls for messages, and a cooking session lives in the server's memory.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Recipes the bot saves survive redeploys and restarts.
[[mounts]]
  source = 'saved_recipes'
  destination = '/app/saved_recipes'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
