# fly.toml app configuration file generated for bemychef on 2026-11-15T17:57:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bemychef'
primary_region = 'arn'

[build]
[[mounts]]
  source = 'saved_recipes'
  destination = '/app/saved_recipes'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
