<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<script>
// The glasses lay the page out on their 600x600 display. A phone lays it out at its own size instead:
// held upright, a 600px-wide page would be shrunk to fit and leave everything too small to read.
if (screen.width !== 600 || screen.height !== 600)
  document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1.0, user-scalable=no';
</script>
<meta name="description" content="Hands-free cooking assistant for Meta Ray-Ban Display glasses: step-by-step recipes you can follow by voice while you cook.">
<meta name="mrbd-web-app-capable" content="yes">
<title>Cooking Assistant</title>
<link rel="icon" type="image/png" href="icon.png">
<!-- Added to a phone's home screen, the page opens without the browser's bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cooking">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/*
 * Meta Ray-Ban Display: a 600x600 additive screen. Black emits no light, so black is see-through and
 * every lit pixel floats in front of the kitchen. The rules follow from that:
 *   - No panels, borders or fills. Hierarchy is brightness and size: `ink` for what is read, `dim` for the rest.
 *   - One accent, only for the highlight box, because it has to stand out on a camera frame.
 *   - Large type, read at a glance with busy hands. Nothing under 18px.
 *   - Motion only on change: a new step or answer arrives with 8px of movement. Nothing loops.
 * Where a camera is available (a phone or computer, not the glasses), it fills the whole page and the display
 * is composited over it (mix-blend-mode: screen, which is how an additive display works). On a computer
 * wider than the glasses the display keeps its 600x600 size in the middle, with the bar along its bottom edge.
 * On a phone the display is the whole screen and the type is smaller: a phone is held close and is sharp.
 * Held sideways, the text keeps to the left half and the right half is left to the camera.
 */
:root {
  --ink: #ffffff; --dim: #8f8f8f; --faint: #3a3a3a; --accent: #5ce1e6;
  --pad: 32px; --enter: 220ms cubic-bezier(0.2, 0, 0, 1);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-feature-settings: "cv01", "ss03";
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); overflow: hidden; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.note { display: none; }

/* ---- the display --------------------------------------------------------------------------- */
#stage { position: fixed; inset: 0; margin: 0; }
#room { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden;
  filter: brightness(0.5) saturate(0.85); }   /* the lenses are tinted */
#room.live { visibility: visible; }   /* only with a camera: an empty video draws a play button on the glasses */
#hud { position: absolute; inset: 0; padding: var(--pad) var(--pad) 96px; display: flex; flex-direction: column;
  mix-blend-mode: screen; }
/* Before the assistant is called, only how to call it is lit. */
#wake { position: absolute; inset: 0; margin: 0; padding: var(--pad) var(--pad) 96px; display: flex; flex-direction: column;
  justify-content: center; gap: 10px; font-size: 20px; line-height: 1.4; color: var(--dim); mix-blend-mode: screen;
  animation: enter var(--enter) both; }
#tap { color: var(--ink); }
#wake small { margin-top: 18px; max-width: 44ch; font-size: 15px; line-height: 1.45; }
#wake b { font-size: 32px; line-height: 1.2; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 28px;
  font-size: 18px; color: var(--dim); }
.meta { display: flex; align-items: center; gap: 14px; }
.progress { display: flex; gap: 4px; }
.progress i { width: 18px; height: 3px; border-radius: 2px; background: var(--faint); }
.progress i.done { background: var(--dim); }
.progress i.now { background: var(--ink); }

#view { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.enter { animation: enter var(--enter) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }

.idle h1 { margin: 0; font-size: 32px; font-weight: 500; letter-spacing: -0.02em; }
.idle p { margin: 10px 0 0; font-size: 20px; line-height: 1.4; color: var(--dim); max-width: 26ch; }

.step { justify-content: flex-start; padding-top: 28px; }
.step .text { margin: 0; font-size: 36px; line-height: 1.18; font-weight: 500; letter-spacing: -0.02em;
  overflow: hidden; max-height: 7.2em; text-wrap: balance; }
.uses { margin: 24px 0 0; padding: 0; list-style: none; font-size: 20px; line-height: 1.5; color: var(--dim); }

.recipe { justify-content: flex-start; padding-top: 12px; }
.recipe .photo { display: block; width: 100%; height: 190px; object-fit: cover; border-radius: 12px; }
.recipe h1 { margin: 18px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recipe .about { display: flex; gap: 18px; margin-top: 6px; font-size: 18px; color: var(--dim); }
.recipe ul { flex: 1 1 0; min-height: 0; overflow: hidden; margin: 14px 0 0; padding: 0; list-style: none;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: max-content; column-gap: 24px;
  align-content: start;
  font-size: 19px; line-height: 1.55; }
.recipe li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recipe li.more { color: var(--dim); }

.snap { position: relative; align-self: center; max-width: 100%; max-height: 100%; border-radius: 12px; overflow: hidden; }
.snap img { display: block; width: 100%; height: 100%; object-fit: cover; }
.box { position: absolute; border: 3px solid var(--accent); border-radius: 8px; }
.box span { position: absolute; left: -3px; bottom: 100%; margin-bottom: 6px; padding: 2px 8px; border-radius: 6px;
  background: var(--accent); color: #000; font-size: 18px; font-weight: 600; white-space: nowrap; }
.box.low span { bottom: auto; top: 100%; margin: 6px 0 0; }

#caption { min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
.heard { font-size: 18px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reply { font-size: 24px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em; }
.hint { font-size: 18px; color: var(--dim); }

/* ---- the bar: what the microphone hears is written here as it is said; without a microphone, type here */
/* Inside the display, along its bottom edge: whatever shows only the 600x600 display shows the bar too. */
#controls { position: absolute; left: var(--pad); right: var(--pad); bottom: 20px; display: flex; gap: 8px; }
.control { flex: none; height: 56px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent;
  color: var(--dim); cursor: pointer; outline: none; white-space: nowrap; font-size: 19px; }
#ask { flex: 1 1 0; min-width: 0; height: 56px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent;
  outline: none; font-size: 19px; color: var(--ink); appearance: none; }
#ask::placeholder { color: var(--dim); }
.control:focus { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
#ask.dictating { color: var(--dim); }   /* still being said */

/* ---- preview on a computer ----------------------------------------------------------------- */
@media (min-width: 960px) and (min-height: 760px) {
  body { display: grid; place-items: center; }
  #layout { display: grid; grid-template-columns: 600px; }
  #stage { position: relative; inset: auto; width: 600px; height: 600px; }
  .note { display: block; position: relative; margin: 16px 0 0; text-align: center; font-size: 18px; color: var(--dim); }
  .control:hover { background: rgb(255 255 255 / 0.05); }
}

/* ---- on a phone ---------------------------------------------------------------------------- */
/* Narrower than the glasses (upright) or shorter than them (sideways). */
@media (max-width: 599px), (max-height: 599px) {
  :root { --pad: 20px; }
  #hud, #wake { padding-bottom: 76px; }
  #wake { gap: 6px; font-size: 16px; }
  #wake b { font-size: 26px; }
  #wake small { margin-top: 12px; font-size: 13px; }
  .top { min-height: 22px; font-size: 14px; }
  .progress i { width: 14px; }
  .idle h1 { font-size: 26px; }
  .idle p { font-size: 16px; }
  .step { padding-top: 16px; }
  .step .text { font-size: 28px; }
  .uses { margin-top: 16px; font-size: 16px; }
  .recipe .photo { height: min(190px, 26vh); }
  .recipe h1 { margin-top: 12px; font-size: 22px; }
  .recipe .about { font-size: 14px; }
  .recipe ul { margin-top: 10px; column-gap: 16px; font-size: 15px; }
  .box span { font-size: 14px; }
  #caption { min-height: 48px; }
  .heard, .hint { font-size: 14px; }
  .reply { font-size: 18px; }
  #controls { bottom: 12px; }
  .control, #ask { height: 48px; padding: 0 12px; font-size: 16px; }   /* under 16px, iOS zooms in on the focused input */
}
/* Sideways: the text keeps to the left half. */
@media (max-height: 599px) and (orientation: landscape) {
  #hud, #wake { right: 50%; }
  #controls { right: calc(50% + var(--pad)); }
  .step { padding-top: 8px; }
  .recipe { padding-top: 4px; }
}

@media (prefers-reduced-motion: reduce) { .enter, #wake { animation: none; } }
</style>
</head>
<body>
<div id="layout">
  <figure id="stage">
    <video id="room" autoplay muted playsinline></video>
    <p id="wake"><span id="tap" hidden>Tap the screen to turn on the microphone, then</span><span>Say</span><b>“Gemini, I want to cook”</b><span>to start!</span>
      <small>(Try to show a POV cooking video from YouTube to the camera, for a more immersive tryout of the demo! Sorry we can't actually get you a pair of Meta glasses right now...)</small></p>
    <main id="hud">
      <div class="top"><div class="meta" id="meta"></div><span id="status">Connecting</span></div>
      <div id="view"></div>
      <div id="caption"></div>
    </main>
    <section id="controls" aria-label="Say something to the assistant">
      <input type="text" id="ask" autocomplete="off" aria-label="What you say" hidden>
      <button type="button" class="control" id="mic" hidden>Mic off</button>
      <button type="button" class="control" id="again" hidden>Start over</button>
    </section>
  </figure>
  <p class="note">Glasses preview. On the display, black is see-through.</p>
</div>

<script>
// ---- state -----------------------------------------------------------------------------------
// Everything the server says lands in `state`; `render` draws the display from it.

const REPLY_HOLD_MS = 8000;   // how long a spoken answer stays on screen
const LOOKING_MS = 1200;      // how long "Looking" shows after the camera takes a photo
const KEEP_FRAMES = 4;        // snapshots kept for highlights

const state = {
  phase: 'connecting',        // connecting | listening | thinking | offline
  awake: false,               // until the user calls the assistant, the display shows only how to call it
  recipe: null,               // candidate on screen, waiting for yes or no
  step: null,                 // {number, total, text, ingredients} while cooking
  highlight: null,            // {frame_id, box, label}
  heard: '', reply: '',
  mic: true, speaking: false,   // the microphone is open from the start
  looking: false,             // the camera just took a photo
  unreadStep: null,           // a new step's text, read aloud when the assistant's turn is over
  visiting: null,             // {awake, recipe, step} of an earlier screen reached with Back, until the server moves on
};
const frames = new Map();     // frame_id -> {url, ratio}
let replyTimer = null, highlightTimer = null, lookingTimer = null, shownView = '', fitView = null;

const $ = id => document.getElementById(id);
const video = $('room');

function h(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter(c => c != null && c !== false));
  return node;
}

// ---- render ----------------------------------------------------------------------------------

function render() {
  $('hud').hidden = !shown().awake && state.phase !== 'offline';   // not called yet: only the wake hint is lit
  $('wake').hidden = !$('hud').hidden;
  renderTop();
  renderView();
  renderCaption();
  fitView?.();          // after the caption: an answer appearing leaves the view less room
  renderControls();
  syncMic();
}

function renderTop() {
  $('status').textContent = state.looking ? 'Looking' : { connecting: 'Connecting', listening: 'Listening',
                              thinking: 'Thinking', offline: 'Disconnected' }[state.phase];
  const { step, recipe } = shown();
  if (!step || recipe || state.highlight) return $('meta').replaceChildren();
  const bar = h('div', { className: 'progress' }, ...Array.from({ length: step.total }, (_, i) =>
    h('i', { className: i + 1 < step.number ? 'done' : i + 1 === step.number ? 'now' : '' })));
  $('meta').replaceChildren(h('span', { textContent: `Step ${step.number} of ${step.total}` }), bar);
}

// A view is rebuilt, and animates in, only when what it shows changes.
function renderView() {
  const { highlight } = state, { recipe, step } = shown();
  const key = highlight ? `hl:${highlight.frame_id}:${highlight.box}` : recipe ? `recipe:${recipe.url}:${recipe.image}`
            : step ? `step:${step.number}:${step.text}` : 'idle';
  if (key === shownView) return;
  shownView = key;
  const view = highlight ? highlightView(highlight) : recipe ? recipeView(recipe) : step ? stepView(step) : idleView();
  $('view').className = view.className + ' enter';
  $('view').replaceChildren(...view.children.filter(Boolean));
  fitView = view.after || null;
}

function idleView() {
  return { className: 'idle', children: [
    h('h1', { textContent: 'What are we cooking?' }),
    h('p', { textContent: 'Name a dish, or the ingredients you want to use.' }),
  ] };
}

function stepView(step) {
  // Non-breaking hyphens: "stir-fry" stays on one line.
  const text = h('p', { className: 'text', textContent: step.text.replace(/(\w)-(\w)/g, '$1\u2011$2') });
  const uses = step.ingredients.length ? h('ul', { className: 'uses' },
    ...step.ingredients.map(i => h('li', { textContent: i }))) : null;
  return { className: 'step', children: [text, uses], after: () => fitText(text) };
}

function recipeView(recipe) {
  const list = h('ul');
  let site = '';
  try { site = new URL(recipe.url).hostname.replace(/^www\./, ''); } catch { /* no site shown */ }
  const steps = recipe.instructions?.length;
  const photo = recipe.image ? h('img', { className: 'photo', alt: '', referrerPolicy: 'no-referrer', decoding: 'async', src: recipe.image,
                                          onerror() { this.remove(); fitList(list, recipe.ingredients); } }) : null;
  return { className: 'recipe', children: [
    photo,
    h('h1', { textContent: recipe.title }),
    h('div', { className: 'about' }, site && h('span', { textContent: site }),
      steps && h('span', { textContent: `${steps} steps` })),
    list,
  ], after: () => fitList(list, recipe.ingredients) };
}

function highlightView(hl) {
  const frame = frames.get(hl.frame_id) || { url: null, ratio: 4 / 3 };
  const snap = h('div', { className: 'snap' });
  snap.style.aspectRatio = frame.ratio;
  if (frame.url) snap.append(h('img', { src: frame.url, alt: 'Snapshot of your view', decoding: 'async' }));
  const [ymin, xmin, ymax, xmax] = hl.box;            // 0..1000 of the frame
  const box = h('div', { className: 'box' + (ymin < 120 ? ' low' : '') }, hl.label && h('span', { textContent: hl.label }));
  box.style.cssText = `top:${ymin / 10}%;left:${xmin / 10}%;height:${(ymax - ymin) / 10}%;width:${(xmax - xmin) / 10}%`;
  snap.append(box);
  return { className: 'highlight', children: [snap], after: () => {
    const room = $('view');
    snap.style.width = `${Math.min(room.clientWidth, room.clientHeight * frame.ratio)}px`;
  } };
}

function renderCaption() {
  const { heard, reply, phase } = state, { recipe, step } = shown();
  let lines;
  if (reply) lines = [heard && h('div', { className: 'heard', textContent: `“${heard}”` }),
                      h('div', { className: 'reply enter', textContent: reply })];
  else if (phase === 'thinking' && heard) lines = [h('div', { className: 'heard', textContent: `“${heard}”` })];
  else if (recipe && state.visiting) lines = [];        // an earlier candidate: no longer a question
  else if (recipe) lines = [h('div', { className: 'hint', textContent: 'Say “yes” or “no”' })];
  else if (step) lines = [h('div', { className: 'hint', textContent: 'Say “next”, or ask with “Gemini, …”' })];
  else lines = [];
  $('caption').replaceChildren(...lines.filter(Boolean));
}

// Shrink long text step by step until it fits its box, from the size the stylesheet gives it (36px on the
// glasses, smaller on a phone) down to about 70% of that.
function fitText(node) {
  node.style.fontSize = '';
  let size = parseFloat(getComputedStyle(node).fontSize);
  const min = Math.round(size * 0.72);
  while (node.scrollHeight > node.clientHeight + 1 && size > min) node.style.fontSize = `${size -= 2}px`;
}

// Show as many ingredients as fit; the last cell says how many are left out.
function fitList(list, items) {
  const rows = n => items.slice(0, n).map(t => h('li', { textContent: t }));
  let shown = items.length;
  list.replaceChildren(...rows(shown));
  while (shown > 0 && list.scrollHeight > list.clientHeight) {
    shown--;
    list.replaceChildren(...rows(shown), h('li', { className: 'more', textContent: `+${items.length - shown} more` }));
  }
}

function renderControls() {
  const offline = state.phase === 'offline';
  $('ask').hidden = offline;
  $('ask').placeholder = state.mic ? 'Speak, or type here' : 'Type here, Enter sends';
  $('mic').hidden = offline || !recognition;
  $('mic').textContent = state.mic ? 'Mic on' : 'Mic off';
  $('again').hidden = !offline;
  // The D-pad needs a focused control to start from. On a touch screen, focusing the text bar would open
  // the keyboard over the camera and microphone permission questions, so there the user taps it instead.
  const controls = focusable();
  if (!touchScreen && controls.length && !controls.includes(document.activeElement)) controls[0].focus({ preventScroll: true });
}
const touchScreen = matchMedia('(hover: none) and (pointer: coarse)').matches;

function focusable() {
  return [...$('controls').querySelectorAll('button, input')].filter(c => c.offsetParent && !c.disabled);
}

// ---- screens and browser history ---------------------------------------------------------------
// Each screen has a URL: #/ (empty, not called yet), #/start (what to cook?), #/recipe (a candidate), #/step/N. A new screen from the server pushes
// a history entry that carries what it showed, so Back and Forward can draw it again. A highlight is a
// short overlay on the current screen and adds no entry.

function shown() { return state.visiting || state; }
function screenOf({ awake, recipe, step }) {
  return recipe ? '#/recipe' : step ? `#/step/${step.number}` : awake ? '#/start' : '#/';
}

// The server's screen is the one on display again: record it, as a new entry when the screen changed.
function syncHistory() {
  state.visiting = null;
  const hash = screenOf(state), entry = { awake: state.awake, recipe: state.recipe, step: state.step };
  const url = location.pathname + location.search + hash;
  if (hash === (location.hash || '#/')) history.replaceState(entry, '', url);
  else history.pushState(entry, '', url);
}

window.addEventListener('popstate', e => {
  const to = e.state, live = state.step;
  state.visiting = to && screenOf(to) !== screenOf(state) ? to : null;
  // One step away from where the recipe is: move the recipe too, as saying "back" or "next" would.
  const moved = state.visiting && !to.recipe && to.step && live && !state.recipe ? to.step.number - live.number : 0;
  if (Math.abs(moved) !== 1 || !send(moved < 0 ? 'back' : 'next')) render();
});

// ---- talking to the server -------------------------------------------------------------------

let ws;

// False when the assistant is busy: the text was not sent.
function send(text) {
  if (state.phase !== 'listening') return false;
  ws.send(JSON.stringify({ type: 'utterance', text }));
  Object.assign(state, { phase: 'thinking', heard: text, reply: '' });
  render();
  return true;
}

const handlers = {
  listening() {
    state.phase = 'listening';
    // A new step is read aloud once the turn is over, after anything the assistant said with it.
    if (state.unreadStep) { voice(state.unreadStep); state.unreadStep = null; }
  },
  prompt() { state.awake = true; },
  capture(m) {
    capture(m.frame_id);
    // Show that the camera was used, every time it is.
    state.looking = true;
    clearTimeout(lookingTimer);
    lookingTimer = setTimeout(() => { state.looking = false; render(); }, LOOKING_MS);
  },
  say(m) { speak(m.text); },
  recipe(m) { state.recipe = m.recipe; },
  hide_recipe() { state.recipe = null; },
  step(m) {
    if (m.text !== state.step?.text) state.unreadStep = m.text;
    state.step = { number: m.number, total: m.total, text: m.text, ingredients: m.ingredients || [] };
  },
  highlight(m) {
    state.highlight = m;
    clearTimeout(highlightTimer);
    highlightTimer = setTimeout(() => { state.highlight = null; render(); }, m.ttl * 1000);
  },
  clear_highlight() { clearTimeout(highlightTimer); state.highlight = null; },
};

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    handlers[m.type]?.(m);
    // Not on hide_recipe: the first step follows it, and the idle screen in between is not a screen to go back to.
    if (['recipe', 'step', 'listening'].includes(m.type)) syncHistory();
    render();
  };
  ws.onclose = () => { state.phase = 'offline'; render(); };
}

// ---- the device: speech out, camera, microphone, keys ----------------------------------------

// Spoken and shown as the answer.
function speak(text) {
  state.reply = text;
  clearTimeout(replyTimer);
  replyTimer = setTimeout(() => { state.reply = ''; state.heard = ''; render(); }, REPLY_HOLD_MS);
  voice(text);
}

// Spoken only: for text that is already on the display, such as a step.
function voice(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = /[一-鿿]/.test(text) ? 'zh-CN' : 'en-US';
  // The microphone stays closed while the assistant talks, so it does not hear itself.
  u.onend = u.onerror = () => { utterances.delete(u); speechMayBeOver(); };
  utterances.add(u);
  state.speaking = true;
  speechSynthesis.speak(u);
  watchSpeech();
}

// A phone does not always say when it has finished talking, or that it never started (an iPhone speaks
// only after the page has been tapped), and the microphone would stay closed for good. So the end of
// speech is also watched for: nothing being spoken for a moment means it is over.
const utterances = new Set();      // kept from the garbage collector, which would take their `onend` with them
let speechWatch = null;
function speechMayBeOver() {
  state.speaking = speechSynthesis.speaking || speechSynthesis.pending;
  if (!state.speaking) { clearInterval(speechWatch); speechWatch = null; utterances.clear(); }
  syncMic();
}
function watchSpeech() {
  if (speechWatch) return;
  let started = false, quiet = 0;
  speechWatch = setInterval(() => {
    if (speechSynthesis.speaking || speechSynthesis.pending) { started = true; quiet = 0; }
    else if (++quiet >= (started ? 2 : 6)) speechMayBeOver();   // not started within 2 s: it never will
  }, 300);
}

function capture(frame_id) {
  let jpeg = null;
  if (video.videoWidth) {
    const c = h('canvas', { width: 640, height: Math.round(640 * video.videoHeight / video.videoWidth) });
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.7);
    frames.set(frame_id, { url, ratio: c.width / c.height });
    while (frames.size > KEEP_FRAMES) frames.delete(frames.keys().next().value);
    jpeg = url.slice(url.indexOf(',') + 1);
  }
  ws.send(JSON.stringify({ type: 'frame', frame_id, jpeg }));
}

// The glasses camera is not available to web apps; on a computer the webcam stands in for it.
// A phone shows one permission question at a time, and a second one replaces the first: in Chrome on an
// iPhone the microphone's came up the moment the camera's did. So on a touch screen the microphone is not
// asked for until the user taps the page, which cannot happen while the camera question is up. The tap
// also lets an iPhone speak, and on a phone that can, fills the screen with the page.
// On a computer it waits until the camera picture shows (or a click, if none ever comes).
let cameraSettled = false;
function cameraIsSettled() { cameraSettled = true; $('tap').hidden = true; syncMic(); }
async function startCamera() {
  const tapped = new Promise(done => addEventListener('click', done, { once: true }));
  $('tap').hidden = !touchScreen || !recognition;
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
    video.classList.add('live');
    if (!touchScreen) {
      const showing = new Promise(done => video.videoWidth ? done() : video.addEventListener('playing', done, { once: true }));
      await Promise.race([showing, tapped]);
    }
  } catch { /* no camera: frames go out empty and the preview stays dark */ }
  if (touchScreen) await tapped;
  cameraIsSettled();
}

// Open microphone, as on the real product: everything heard is sent, and the assistant decides whether
// it was addressed. Web apps on the glasses have no microphone; this is the computer's.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = Recognition ? new Recognition() : null;
if (recognition) {
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = new URLSearchParams(location.search).get('lang') || navigator.language;
  recognition.onresult = e => {
    let hearing = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.trim();
      if (!e.results[i].isFinal) hearing += (hearing && text ? ' ' : '') + text;
      else if (text && !send(text)) return showHeard(text, true);   // assistant busy: Enter sends it later
    }
    showHeard(hearing, false);
  };
  recognition.onend = () => { showHeard('', false); if (micWanted()) startMic(); };
  recognition.onerror = e => { if (e.error.includes('not-allowed')) { state.mic = false; render(); } };
}
function micWanted() { return cameraSettled && state.mic && !state.speaking && state.phase === 'listening'; }
function startMic() { try { recognition.start(); } catch { /* already running */ } }
function syncMic() { if (recognition) micWanted() ? startMic() : recognition.stop(); }

// The bar is one line with two sources. What the microphone hears is written into it while it is being
// said, and sent when the sentence ends. What is typed stays until Enter, and is never overwritten by
// the microphone.
let dictating = false;        // the text in the bar came from the microphone and is still being said

function showHeard(text, keep) {
  const ask = $('ask');
  if (ask.value && !dictating) return;                   // typed text is in the bar: leave it alone
  ask.value = text;
  dictating = !keep && !!text;
  ask.classList.toggle('dictating', dictating);
}

function submitAsk() {
  const text = $('ask').value.trim();
  if (dictating || !text || state.phase !== 'listening') return;   // keep the text until the assistant is free
  $('ask').value = '';
  send(text);
}
$('ask').addEventListener('input', () => { dictating = false; $('ask').classList.remove('dictating'); });
// Typed text, or on the glasses the system composer (handwriting or dictation), arrives as `change`.
$('ask').addEventListener('change', submitAsk);
$('mic').addEventListener('click', () => { state.mic = !state.mic; render(); });
$('again').addEventListener('click', () => location.reload());

// D-pad and band input arrive as arrow keys and Enter.
document.addEventListener('keydown', e => {
  const controls = focusable(), active = document.activeElement, typing = active === $('ask');
  if (e.key === 'Enter') {
    e.preventDefault();
    if (typing) submitAsk();
    else if (controls.includes(active)) active.click();
    else controls[0]?.focus();
  } else if (e.key.startsWith('Arrow') && controls.length) {
    if (typing && $('ask').value && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;   // moves the caret
    e.preventDefault();
    const step = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
    controls[(controls.indexOf(active) + step + controls.length) % controls.length].focus();
  }
});

// A tap is what a phone needs before it lets the page speak or fill the screen.
addEventListener('click', () => {
  if (touchScreen && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
});
addEventListener('click', () => {
  if (!('speechSynthesis' in window) || speechSynthesis.speaking || speechSynthesis.pending) return;
  const silent = new SpeechSynthesisUtterance(' ');
  silent.volume = 0;
  speechSynthesis.speak(silent);
}, { once: true });

addEventListener('resize', () => fitView?.());   // a phone turned on its side has a different amount of room
syncHistory();               // a reload starts a new session, on the idle screen
render();
startCamera();
connect();
</script>
</body>
</html>
